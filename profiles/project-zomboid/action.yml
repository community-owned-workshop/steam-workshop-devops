name: Validate Project Zomboid Workshop Item
description: Validates Steam Workshop metadata and a Project Zomboid Build 42 mod package.

inputs:
  content-path:
    description: Path containing the mods directory uploaded to Steam.
    required: true
  metadata-path:
    description: Path to workshop.txt.
    required: true
  preview-path:
    description: Optional path to preview.png.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Validate Project Zomboid Workshop item
      shell: bash
      env:
        VALIDATION_CONTENT_PATH: ${{ inputs.content-path }}
        VALIDATION_METADATA_PATH: ${{ inputs.metadata-path }}
        VALIDATION_PREVIEW_PATH: ${{ inputs.preview-path }}
      run: |
        bash "$GITHUB_ACTION_PATH/validate.sh" \
          "$VALIDATION_CONTENT_PATH" \
          "$VALIDATION_METADATA_PATH" \
          "$VALIDATION_PREVIEW_PATH"
